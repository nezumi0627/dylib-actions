name: Build & Release Swift dylib

on:
  push:
    branches: [ '**' ]
    tags:     [ 'v*' ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4



      - name: Build iOS arm64 dylib (Release)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release --triple arm64-apple-ios15.0 --sdk "$SDK_PATH" --build-path .build/ios
          IOS_LIB=$(find .build/ios -name libMyLibrary.dylib -print -quit)
          mkdir -p .build/release-ios
          cp "$IOS_LIB" .build/release-ios/libMyLibrary.dylib
          install_name_tool -id @rpath/libMyLibrary.dylib .build/release-ios/libMyLibrary.dylib

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyLibrary_iOS
          path: |
            .build/release-ios/libMyLibrary.dylib

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: MyLibrary_iOS
          path: dist

      - name: Zip dylib
        run: |
          cd dist
          zip MyLibrary-${{ github.ref_name }}.zip libMyLibrary.dylib

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MyLibrary-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
