name: Build Tweak.x dylib

on: [push, workflow_dispatch]

jobs:
  build-tweak:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          $HOME/theos/bin/update-theos

      - name: Install ldid
        run: brew install ldid

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make

      - name: Show built dylib
        run: |
          DYLIB=$(find .theos -name "*.dylib" | head -1)
          if [ -f "$DYLIB" ]; then
            echo "✅ Built dylib: $DYLIB"
            file "$DYLIB"
          else
            echo "❌ Failed to find dylib"
            exit 1
          fi

      - name: Upload built dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-x-dylib
          path: .theos/obj/debug/*.dylib
