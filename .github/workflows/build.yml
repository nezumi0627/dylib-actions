name: Build dylib

on: [push, workflow_dispatch]

jobs:
  build-dylib:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Theos
        run: git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install ldid
        run: brew install ldid

      - name: Set Orion Framework Path
        run: |
          export ORION_FRAMEWORK_PATH=$(pwd)/Orion_1.0.2

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export USE_ORION=1
          export ORION_EMBED_FRAMEWORK=1
          make

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: nezu_tweak_dylib
          path: .theos/obj/debug/*.dylib
