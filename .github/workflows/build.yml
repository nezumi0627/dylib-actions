name: Build dylib

on: [push, workflow_dispatch]

jobs:
  build-dylib:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone Theos (with Orion)
        run: git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
        env:
          THEOS: $HOME/theos

      - name: Build dylib using Theos
        run: |
          export THEOS=$HOME/theos
          make clean
          make
          mkdir -p .build/release-ios
          find . -name '*.dylib' -exec cp {} .build/release-ios/ \;

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: nezu_tweak_dylib
          path: .build/release-ios/*.dylib
