name: Build & Release Swift dylib

on:
  push:
    branches: [ '**' ]
    tags:     [ 'v*' ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4



      - name: Install Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
        env:
          THEOS: $HOME/theos

      - name: Install Orion framework
        run: |
          git clone --depth=1 https://github.com/theos/orion.git "$HOME/orion"
          make -C "$HOME/orion" framework THEOS="$HOME/theos"
          mkdir -p "$HOME/theos/vendor/lib" "$HOME/theos/vendor/include"
          cp -R "$HOME/orion/bin/Orion.framework" "$HOME/theos/vendor/lib/"
          cp -R "$HOME/orion/include/Orion" "$HOME/theos/vendor/include/"

      - name: Generate SPM config
        run: |
          export THEOS=$HOME/theos
          make spm

      - name: Build iOS arm64 dylib (Release)
        run: |
          export THEOS=$HOME/theos
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release --triple arm64-apple-ios15.0 --sdk "$SDK_PATH" --build-path .build/ios
          IOS_LIB=$(find .build/ios -name libnezu_tweak.dylib -print -quit)
          mkdir -p .build/release-ios
          cp "$IOS_LIB" .build/release-ios/libnezu_tweak.dylib

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nezu_tweak_iOS
          path: |
            .build/release-ios/libnezu_tweak.dylib

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: nezu_tweak_iOS
          path: dist

      - name: Zip dylib
        run: |
          cd dist
          zip nezu_tweak-${{ github.ref_name }}.zip libnezu_tweak.dylib

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nezu_tweak-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
